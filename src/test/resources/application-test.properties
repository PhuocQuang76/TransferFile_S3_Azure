# Test Configuration for LocalStack and in-memory DB
spring.main.allow-bean-definition-overriding=true

# AWS S3 Configuration (LocalStack)
aws.s3.endpoint=http://localhost:4566
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1

# AWS Secrets Manager Configuration (LocalStack)
aws.secrets.secret-name=test-credentials
aws.secrets.region=us-east-1

# Azure Blob Storage Configuration (Azurite)
azure.storage.account-name=devstoreaccount1
azure.storage.account-key=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
azure.container-name=test-container

# Storage Provider Selection for tests
storage.source=s3Service
storage.destination=testDestination

# Transfer Configuration
transfer.concurrency=2
transfer.delete-after-transfer=false

# Logging Configuration for Tests
logging.file.path=./test-logs
logging.level.com.synergisticit.filetransfer=DEBUG
logging.level.software.amazon.awssdk=WARN
logging.level.com.azure.storage=WARN

# Database Configuration (H2 for tests)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
