# Spring Application
spring.application.name=filetransfer

# Server Port
server.port=8586

# Database Configuration
# Credentials are retrieved from AWS Secrets Manager via DataSourceConfig
# spring.datasource.url=jdbc:mysql://localhost:3306/filetransfer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update

# spring.datasource.url=jdbc:mysql://filetransfer-dev-db.chss8042ypu2.us-east-1.rds.amazonaws.com:3306/filetransfer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update

# Database Configuration (MySQL running inside the cluster)
# Override at deploy time with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.datasource.url=jdbc:mysql://mysql.default.svc.cluster.local:3306/filetransfer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

# AWS Base Configuration (Placeholders)
aws.access-key=
aws.secret-key=
aws.region=us-east-1
aws.s3.bucket-name=aileen-bucket-011243863866
aws.s3.region=us-east-1

# Custom Transfer Parameters (Optional)
transfer.concurrency=5
transfer.delete-after-transfer=true

# Application Credentials (replaces AWS Secrets Manager)
# Override per environment with env vars, e.g. APP_CREDENTIALS_S3_BUCKET_NAME
app.credentials.s3-bucket-name=aileen-bucket-011243863866
app.credentials.azure-storage-account-name=s3azureconnector123
app.credentials.azure-storage-account-key=
app.credentials.azure-container-name=s3-azure-connector

# Storage Provider Configuration
# Enables Open/Closed Principle - switch providers without code modification
# Available sources: s3Service (S3), gcsService (Google Cloud Storage - if implemented)
# Available destinations: azureBlobService (Azure), gcsDestination (Google Cloud Storage - if implemented)
storage.source=s3Service
storage.destination=azureBlobService

# Logging Configuration
logging.file.path=./logs

# Logging Levels
logging.level.com.synergisticit.filetransfer=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.com.azure.storage=WARN