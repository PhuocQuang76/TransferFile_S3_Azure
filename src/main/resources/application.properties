# Spring Application
spring.application.name=filetransfer
spring.profiles.default=local

# Server Port
server.port=8586

# Database Configuration (MySQL - each profile overrides the host)
# Local: docker run -d --name filetransfer-mysql -e MYSQL_ROOT_PASSWORD=admin \
#          -e MYSQL_DATABASE=filetransfer -p 3306:3306 mysql:8.0
spring.datasource.url=jdbc:mysql://localhost:3306/filetransfer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

# AWS Base Configuration (safe defaults for local/dev mode)
aws.access-key=
aws.secret-key=
aws.region=us-east-1
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1

# Custom Transfer Parameters (Optional)
transfer.concurrency=5
transfer.delete-after-transfer=true

# Application Credentials (replaces AWS Secrets Manager)
# Override per environment with env vars, e.g. APP_CREDENTIALS_S3_BUCKET_NAME
app.credentials.s3-bucket-name=test-bucket
app.credentials.azure-storage-account-name=
app.credentials.azure-storage-account-key=
app.credentials.azure-container-name=test-container

# Azure Event Hubs (transfer events)
# The connection string is supplied at runtime via AZURE_EVENTHUB_CONNECTION_STRING.
azure.eventhub.enabled=false
azure.eventhub.connection-string=
azure.eventhub.event-hub-name=file-transfers

# Storage Provider Configuration
# Enables Open/Closed Principle - switch providers without code modification
# Available sources: s3Service (S3), gcsService (Google Cloud Storage - if implemented)
# Available destinations: azureBlobService (Azure), gcsDestination (Google Cloud Storage - if implemented)
storage.source=s3Service
storage.destination=azureBlobService

# Logging Configuration
logging.file.path=./logs

# Logging Levels
logging.level.com.synergisticit.filetransfer=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.com.azure.storage=WARN

