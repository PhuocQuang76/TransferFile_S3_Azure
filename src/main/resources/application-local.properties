# Spring Application
spring.application.name=filetransfer

# Server Port
server.port=8586

# Database Configuration (Local Docker MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/filetransfer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

# AWS Base Configuration (Your real S3 bucket for testing streams)
aws.access-key=
aws.secret-key=
aws.region=us-east-1
aws.s3.bucket-name=aileen-bucket-011243863866
aws.s3.region=us-east-1

# AWS Secrets Manager Configuration (Leave blank or mock locally if your app fetches credentials dynamically)
aws.secrets.secret-name=s3-to-azure/credentials
aws.secrets.region=us-east-1

# Custom Transfer Parameters
transfer.concurrency=5
transfer.delete-after-transfer=true

# Storage Provider Configuration
storage.source=s3Service
storage.destination=azureBlobService

# Logging Configuration
logging.file.path=./logs
logging.level.com.synergisticit.filetransfer=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.com.azure.storage=WARN