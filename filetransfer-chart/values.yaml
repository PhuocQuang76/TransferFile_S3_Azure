replicaCount: 1

image:
  repository: filetransfer
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8586
  targetPort: 8586

env:
  springProfilesActive: "dev"
  serverPort: 8586
  awsRegion: "us-east-1"

secret:
  name: filetransfer-secret
  # Real values come from an untracked overlay (e.g. values-minikube.yaml).
  # Everything here stays empty so nothing sensitive is committed.
  data:
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_REGION: "us-east-1"
    APP_CREDENTIALS_AZURE_STORAGE_ACCOUNT_KEY: ""
    SPRING_DATASOURCE_URL: ""
    SPRING_DATASOURCE_USERNAME: ""
    SPRING_DATASOURCE_PASSWORD: ""
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: ""

resources:
  requests:
    cpu: "100m"
    memory: "1024Mi"  # Increased from 512Mi
  limits:
    cpu: "500m"
    memory: "2048Mi"  # Increased from 1024Mi