apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-filetransfer
  labels:
    app.kubernetes.io/name: filetransfer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: filetransfer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filetransfer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: filetransfer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.env.serverPort | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfilesActive | quote }}
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
            - name: AWS_SECRETS_ENABLED
              value: {{ .Values.env.awsSecretsEnabled | quote }}
            - name: AWS_SECRETS_SECRET_NAME
              value: {{ .Values.env.awsSecretsSecretName | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true